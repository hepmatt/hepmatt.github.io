<title>Lynn Family Lines</title>
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#1c2826;--muted:#5a6b66;--rule:#d3dcd8;--accent:#2e5e52;--err:#a3342b}
@media (prefers-color-scheme: dark){:root{--bg:#121817;--card:#1a2321;--ink:#e2eae7;--muted:#93a39e;--rule:#2c3a37;--accent:#7fb8a6;--err:#e58a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:28px 24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font:600 1.4rem/1.2 Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.85rem;font-weight:600}
input{font:1rem inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button{font:600 1rem inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{color:var(--err);font-size:.88rem;min-height:1.3em}
</style></head>
